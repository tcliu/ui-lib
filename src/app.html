<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>UI Library</title>
    <script>
      // Apply the persisted theme before first paint to avoid a dark flash
      // for non-default-theme users; keep the theme list in sync with
      // src/lib/styles.css.
      try {
        var stored = JSON.parse(localStorage.getItem('ui-lib:web-settings') || '{}').theme
        var themes = ['light', 'ember', 'sepia', 'nebula', 'graphite', 'forest', 'plum', 'mint', 'olive', 'lavender']
        if (themes.indexOf(stored) !== -1) {
          document.documentElement.dataset.theme = stored
        }
      } catch {
        /* unreadable storage falls back to the default dark palette */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
